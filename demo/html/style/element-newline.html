<html>

  <title>element-newline</title>

<body>
  
  <h1>hello</h1><h2>title2</h2>

  <div><p>p1</p><p>p2 <span>text</span></p></div>

  <p>p3</p> <!-- 段落 -->

    <p>It's <em>true</em>!</p>
  </div>

  <pre>
    <div></div><div></div>
  </pre>

  <code>
    <span></span><div></div>
  </code>
