<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <meta name="format-detection" content="telephone=no,email=no,date=no,address=no" />
  <meta name="description" content="html-eslint test page" />
  <meta name="author" content="立树" />
  <title>indent</title>
</head>
<body>

  <!-- ✅ 正确示例 -->
  <div class="box">
    <h2>title</h2>
    <p>paragraph</p>
    <ul>
      <li>item1</li>
      <li>item2</li>
      <li>item3</li>
    </ul>
    <table>
      <tr>
        <th>header1</th>
        <th>header2</th>
      </tr>
      <tr>
        <td>cell1</td>
        <td>cell2</td>
      </tr>
    </table>
  </div>

  <!-- ❌ 错误示例 -->
  <div class="box">
      <h2>title</h2>
        <p>paragraph</p>
    <ul>
    <li>item1</li>
    <li>item2</li>
    <li>item3</li>
    </ul>
    <table>
        <tr><th>header1</th><th>header2</th></tr>
        <tr><td>cell1</td><td>cell2</td></tr>
    </table>
  </div>

</body>
</html>
