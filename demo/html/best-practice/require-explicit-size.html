<!-- eslint @html-eslint/require-explicit-size: "error" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <meta name="format-detection" content="telephone=no,email=no,date=no,address=no" />
  <meta name="description" content="html-eslint test page" />
  <meta name="author" content="立树" />
  <title>require-explicit-size</title>
</head>
<body>

  <!-- ✅ 正确示例 -->
  <img src="/my-image.png" width="400" height="300" alt="pic" />
  <iframe title="frame" src="/page" width="400" height="300"></iframe>
  <img src="/my-image.png" alt="pic" class="has-size-class" />
  <img src="/my-image.png" alt="pic" id="has-size-id" />
  <iframe title="frame" src="/page" class="has-size-class"></iframe>
  <iframe title="frame" src="/page" id="has-size-id2"></iframe>

  <!-- ❌ 错误示例 -->
  <img src="/my-image.png" alt="pic" />
  <iframe title="frame" src="/page"></iframe>

</body>
</html>
