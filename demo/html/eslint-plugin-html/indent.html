<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="html-eslint test page" />
  <meta name="author" content="立树" />
  <title>demo</title>

  <script>
    /* eslint-disable no-undef, prefer-arrow-callback */
    
    // eslint-plugin-html 演示示例
    // 将 html-support.js 中的 parser: "@html-eslint/parser" 修改为 parser: require.resolve("@html-eslint/parser"),
    // 就会导致 eslint-plugin-html 插件失效，当前文件就会触发 html/indent 报错
    $(document).ready(function() {
      ExplodeCountdown({
        elm: "demo",
        width: $(window).width() - 12,
        height: $(window).height() - 12,
        endTime: Date.now() + 3600 * 1000,
      });
    });
  </script>
</head>
<body>

  <canvas class="demo" id="demo"></canvas>

</body>
</html>
