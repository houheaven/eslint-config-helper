<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <meta name="format-detection" content="telephone=no,email=no,date=no,address=no" />
  <meta name="description" content="html-eslint test page" />
  <meta name="author" content="立树" />
  <title>max-element-depth</title>
</head>
<body>

  <!-- HTML 元素嵌套深度为 3 - html / body / div.lv1 -->
  <div class="lv1">
  </div>

  <!-- HTML 元素嵌套深度为 4 - html / body / div.lv1 / div.lv2 -->
  <div class="lv1">
    <div class="lv2">
    </div>
  </div>

  <!-- HTML 元素嵌套深度为 5 - html / body / div.lv1 / div.lv2 / div.lv3 -->
  <div class="lv1">
    <div class="lv2">
      <div class="lv3">
      </div>
    </div>
  </div>

  <!-- HTML 元素嵌套深度为 6 - html / body / div.lv1 / div.lv2 / div.lv3 / div.lv4 -->
  <div class="lv1">
    <div class="lv2">
      <div class="lv3">
        <div class="lv4">
        </div>
      </div>
    </div>
  </div>

  <!-- HTML 元素嵌套深度为 7 - html / body / div.lv1 / div.lv2 / div.lv3 / div.lv4 / div.lv5 -->
  <div class="lv1">
    <div class="lv2">
      <div class="lv3">
        <div class="lv4">
          <div class="lv5">
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
