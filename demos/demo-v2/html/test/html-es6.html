<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <meta name="format-detection" content="telephone=no,email=no,date=no,address=no" />
  <meta name="description" content="html-eslint test page" />
  <meta name="author" content="立树" />
  <title>demo</title>
  
  <script type="module">
    // 规则: import/no-empty-named-blocks
    // 等级: warn

    import {} from "mod";
    import Default, {} from "mod";

    // 在实际项目中，你会通过 npm install lit-html 来安装
    // 这里为了演示，我们直接从 CDN 引入
    import { html, render } from "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js";

    // 定义一个变量
    const value = "my-dynamic-id";

    // 使用 html 标签函数创建一个模板
    const template = html`<div id='${value}'>Hello Lit!</div>`;

    // 将模板渲染到页面上的一个容器元素中
    render(template, document.getElementById("app"));
  </script>
</head>
<body>

  <!--
    规则: @html-eslint/quotes
    等级: warn
  -->
  
  <!-- ✅ 正确示例 -->
  <div id="app"></div>
  <div data-attr="foo"></div>
  <div data-attr='containing "double" quotes'></div>

  <!-- ❌ 错误示例 -->
  <div data-attr='foo'></div>


  <!--
    规则: @html-eslint/id-naming-convention
    等级: error
  -->
  
  <!-- snake_case -->
  <div id="foo_bar"></div>

  <!-- camelCase -->
  <div id="fooBar"></div>

  <!-- PascalCase -->
  <div id="FooBar"></div>

  <!-- kebab-case -->
  <div id="foo-bar"></div>

</body>
</html>
